    aliases: [LLM as a judge, LLM judge, LLM-as-judge, judge model, LLM como juiz]
    oracle: pseudo-automatico
  - id: metamorphic-testing
    name: metamorphic testing
    aliases: [metamorphic relation, invariance test, paraphrase test, consistency check, teste metamórfico]
    oracle: derivado
    ambiguous: true
  - id: property-based-testing
    name: property-based testing
    aliases: [property test, property-based test, teste de propriedade]
    oracle: derivado
    ambiguous: true
  - id: golden-dataset
    name: golden dataset
    aliases: [gold standard, ground truth, reference set, eval set, reference answers, dataset de referência]
    oracle: referencia
    ambiguous: true
  - id: eval-regression
    name: eval regression
    aliases: [regression testing, quality gate, CI gate, prompt regression, snapshot test]
    oracle: referencia
    ambiguous: true
  - id: red-teaming
    name: red teaming
    aliases: [adversarial eval, jailbreak testing, prompt injection test, fault injection]
    ambiguous: true
  - id: synthetic-test-generation
    name: synthetic test generation
    aliases: [synthetic dataset, test set generation, synthetic eval data]
  - id: trajectory-evaluation
    name: trajectory evaluation
    aliases: [trajectory eval, step-level eval, execution trace, tool call evaluation]
    applies_to: [agente]
    ambiguous: true
  - id: human-evaluation
    name: human evaluation
    aliases: [human-in-the-loop evaluation, manual review, human annotation]
    oracle: humano
    ambiguous: true
  - id: assertion-based-testing
    name: assertion-based testing
    aliases: [deterministic assertion, exact match, schema validation, structured output validation]
    oracle: especificado
    ambiguous: true
