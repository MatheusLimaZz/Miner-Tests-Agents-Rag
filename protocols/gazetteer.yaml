# ==========================================================================
# Gazetteer semente — Protocolo E2 v2, §7.2 e §12.2
# ==========================================================================
# Lista inicial de âncoras, expandida iterativamente: ferramenta nova encontrada
# entra aqui e dispara nova rodada, até estabilizar. Versionado junto ao protocolo.
#
# Campos das ferramentas:
#   id / name / aliases  — identificador canônico e nomes (menção em texto = N1)
#   family               — família do Anexo A
#   applies_to           — rag, agente (padrão: ambos)
#   python_imports       — módulos de topo (`import X`, `from X import`) = N2
#   packages             — nomes de dependência (pyproject, requirements, package.json) = N2
#   config_files         — arquivos cuja presença indica uso = N2
#   cli                  — comandos cuja invocação em CI indica adoção = N3
#   repos                — owner/repo da própria ferramenta (consultas `{repo}`)
#   ambiguous            — nome colide com palavra comum: só conta com contexto
#   anchor               — expande `{anchor}`/`{repo}` nas consultas (padrão: true)
#
# Repositórios e nomes de pacote devem ser conferidos no piloto.
# ==========================================================================

