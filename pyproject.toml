[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msrkit"
version = "0.1.0"
description = "Mining grey literature through official APIs for empirical software engineering research"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "typer[all]>=0.12,<1",
    "rich>=13,<14",
    "tenacity>=8.3,<10",
    "duckdb>=1.0,<2",
    "PyYAML>=6,<7",
    "feedparser>=6.0,<7",
]

[project.scripts]
msrkit = "msrkit.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-recording>=0.13,<1",
    "vcrpy>=6,<7",
    "freezegun>=1.4,<2",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "pytest-cov>=5,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/msrkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: marks tests that make real network requests (deselect with '-m \"not network\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["A003"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["msrkit"]

[tool.coverage.run]
source = ["msrkit"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
